<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Static-first Search Foundation 구조</title><desc id="desc">문서, 발견, 연결, 검증의 네 단계로 정적 사이트 검색 기반을 설명하는 개념도</desc><rect width="1200" height="630" fill="#f7f7f5"/><text x="72" y="92" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#111">Static-first Search Foundation</text><text x="72" y="132" font-family="Arial, sans-serif" font-size="20" fill="#555">JERRYBAY original illustration · implementation concept</text><g font-family="Arial, sans-serif"><rect x="86" y="215" width="225" height="170" rx="20" fill="#fff" stroke="#bbb"/><text x="112" y="262" font-size="23" font-weight="700">1. Document</text><text x="112" y="306" font-size="18">URL · Title · Description</text><text x="112" y="336" font-size="18">Canonical · H1</text><rect x="351" y="215" width="225" height="170" rx="20" fill="#fff" stroke="#bbb"/><text x="377" y="262" font-size="23" font-weight="700">2. Discover</text><text x="377" y="306" font-size="18">robots · sitemap</text><text x="377" y="336" font-size="18">feed · crawl routes</text><rect x="616" y="215" width="225" height="170" rx="20" fill="#fff" stroke="#bbb"/><text x="642" y="262" font-size="23" font-weight="700">3. Connect</text><text x="642" y="306" font-size="18">Hub → Detail → Related</text><text x="642" y="336" font-size="18">내부 링크 · CTA</text><rect x="881" y="215" width="225" height="170" rx="20" fill="#fff" stroke="#bbb"/><text x="907" y="262" font-size="23" font-weight="700">4. Verify</text><text x="907" y="306" font-size="18">HTML · JSON-LD · links</text><text x="907" y="336" font-size="18">desktop · mobile QA</text><path d="M316 300h28M581 300h28M846 300h28" stroke="#777" stroke-width="3"/><text x="72" y="500" font-size="21" font-weight="700" fill="#111">핵심:</text><text x="138" y="500" font-size="21" fill="#333">CMS보다 먼저 공개 URL과 검색엔진이 읽는 사실을 일관되게 만들고 자동 검증합니다.</text></g></svg>