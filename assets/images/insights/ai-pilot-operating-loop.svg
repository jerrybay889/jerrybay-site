<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">AI 파일럿 운영 전환 흐름</title><desc id="desc">문제 정의에서 업무 산출물, 검증, 운영 책임으로 이어지는 네 단계 개념도</desc><rect width="1200" height="630" fill="#f7f7f5"/><text x="72" y="92" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#111">AI 파일럿을 운영체계로 바꾸는 4단계</text><text x="72" y="132" font-family="Arial, sans-serif" font-size="20" fill="#555">JERRYBAY original illustration · concept, not customer evidence</text><g font-family="Arial, sans-serif"><rect x="72" y="210" width="230" height="170" rx="20" fill="#fff" stroke="#bbb"/><text x="96" y="258" font-size="22" font-weight="700">1. 문제</text><text x="96" y="300" font-size="18">누가 어떤 판단·반복업무를</text><text x="96" y="330" font-size="18">바꾸려는지 고정</text><rect x="334" y="210" width="230" height="170" rx="20" fill="#fff" stroke="#bbb"/><text x="358" y="258" font-size="22" font-weight="700">2. 산출물</text><text x="358" y="300" font-size="18">다음 업무 단계에서 실제로</text><text x="358" y="330" font-size="18">사용할 결과 형식 정의</text><rect x="596" y="210" width="230" height="170" rx="20" fill="#fff" stroke="#bbb"/><text x="620" y="258" font-size="22" font-weight="700">3. 검증</text><text x="620" y="300" font-size="18">입력→생성→검토→전달을</text><text x="620" y="330" font-size="18">끝까지 재현</text><rect x="858" y="210" width="270" height="170" rx="20" fill="#fff" stroke="#bbb"/><text x="882" y="258" font-size="22" font-weight="700">4. 운영 책임</text><text x="882" y="300" font-size="18">승인·예외·기록·변경 책임을</text><text x="882" y="330" font-size="18">명시적으로 분리</text><g fill="#777"><path d="M306 295h22l-11-9zm0 0h22l-11 9z"/><path d="M568 295h22l-11-9zm0 0h22l-11 9z"/><path d="M830 295h22l-11-9zm0 0h22l-11 9z"/></g><text x="72" y="490" font-size="22" font-weight="700" fill="#111">핵심:</text><text x="145" y="490" font-size="22" fill="#333">모델 성능만이 아니라 실제 업무 흐름과 책임 경계를 함께 검증합니다.</text></g></svg>