<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">AIKUS 학습 실행 축적 루프</title><desc id="desc">Learning Lab, Work Studio, Archive, Reuse가 이어지는 제품 흐름 개념도</desc><rect width="1200" height="630" fill="#f7f7f5"/><text x="72" y="92" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#111">AIKUS: 학습이 실제 업무로 이어지는 제품 루프</text><text x="72" y="132" font-family="Arial, sans-serif" font-size="20" fill="#555">JERRYBAY original illustration · product concept, not customer outcome evidence</text><g font-family="Arial, sans-serif"><rect x="92" y="220" width="220" height="160" rx="22" fill="#fff" stroke="#bbb"/><text x="120" y="270" font-size="24" font-weight="700">Learning Lab</text><text x="120" y="312" font-size="18">업무 맥락이 있는 학습</text><rect x="358" y="220" width="220" height="160" rx="22" fill="#fff" stroke="#bbb"/><text x="386" y="270" font-size="24" font-weight="700">Work Studio</text><text x="386" y="312" font-size="18">실제 업무 산출물 실행</text><rect x="624" y="220" width="220" height="160" rx="22" fill="#fff" stroke="#bbb"/><text x="652" y="270" font-size="24" font-weight="700">Archive</text><text x="652" y="312" font-size="18">결과·맥락 저장</text><rect x="890" y="220" width="220" height="160" rx="22" fill="#fff" stroke="#bbb"/><text x="918" y="270" font-size="24" font-weight="700">Reuse</text><text x="918" y="312" font-size="18">다음 업무의 입력으로 재사용</text><path d="M318 300h32" stroke="#777" stroke-width="3"/><path d="M584 300h32" stroke="#777" stroke-width="3"/><path d="M850 300h32" stroke="#777" stroke-width="3"/><path d="M1000 390c0 88-796 88-796 0" fill="none" stroke="#999" stroke-width="2" stroke-dasharray="8 8"/><text x="72" y="522" font-size="21" font-weight="700" fill="#111">설계 원칙:</text><text x="188" y="522" font-size="21" fill="#333">교육 콘텐츠의 양보다 학습→적용→저장→재사용 연결성을 제품 안에서 유지합니다.</text></g></svg>